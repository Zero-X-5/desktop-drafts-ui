<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tauri Glass Test</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="test-window" aria-labelledby="title">
    <header class="titlebar">
      <div class="drag-zone" data-tauri-drag-region>
        <span class="brand-dot" aria-hidden="true"></span>
        <div>
          <strong id="title">Tauri Glass Test</strong>
          <span>Windows · Acrylic / Blur / Transparent</span>
        </div>
      </div>
      <button id="closeButton" class="window-button" type="button" aria-label="关闭">×</button>
    </header>

    <section class="hero">
      <p class="eyebrow">SYSTEM BACKDROP TEST</p>
      <h1 id="modeTitle">Acrylic</h1>
      <p id="modeDescription" class="description">正在初始化窗口效果…</p>
    </section>

    <section class="mode-switcher" aria-label="玻璃效果模式">
      <button class="mode-button" data-mode="acrylic" type="button">
        <strong>Acrylic</strong>
        <span>Win10 / Win11</span>
      </button>
      <button class="mode-button" data-mode="blur" type="button">
        <strong>Blur</strong>
        <span>系统模糊</span>
      </button>
      <button class="mode-button" data-mode="transparent" type="button">
        <strong>透明</strong>
        <span>clearEffects</span>
      </button>
    </section>

    <section class="status-card" aria-live="polite">
      <div>
        <span>当前模式</span>
        <strong id="currentMode">初始化</strong>
      </div>
      <div>
        <span>Tauri API</span>
        <strong id="apiStatus">等待</strong>
      </div>
      <div>
        <span>透明首帧</span>
        <strong>noRedirectionBitmap</strong>
      </div>
    </section>

    <footer>
      <span>抓住顶部标题区域来回拖动，直接比较三种模式的稳定性。</span>
      <span class="shortcut">1 Acrylic · 2 Blur · 3 Transparent</span>
    </footer>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
