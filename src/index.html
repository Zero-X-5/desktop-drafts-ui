<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tauri Glass Test</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="test-window" aria-labelledby="title">
    <div class="glass-sheen glass-sheen-a" aria-hidden="true"></div>
    <div class="glass-sheen glass-sheen-b" aria-hidden="true"></div>

    <header class="titlebar">
      <div class="drag-zone" data-tauri-drag-region>
        <span class="info-mark" aria-hidden="true">i</span>
        <div class="title-copy">
          <strong id="title">Glass Transparency Lab</strong>
          <span>Tauri 2 · clear / CSS / Acrylic / Blur / split</span>
        </div>
      </div>
      <button id="closeButton" class="window-button" type="button" aria-label="关闭">×</button>
    </header>

    <section class="hero" aria-live="polite">
      <div class="hero-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div>
        <p class="eyebrow">CURRENT MATERIAL</p>
        <h1 id="modeTitle">Pure</h1>
      </div>
    </section>

    <section class="material-card">
      <div class="material-copy">
        <span class="card-kicker">TRANSPARENCY LADDER</span>
        <strong id="currentMode">初始化</strong>
        <p id="modeDescription">正在初始化窗口效果…</p>
      </div>

      <div class="status-pills">
        <div class="status-pill">
          <span>Tauri API</span>
          <strong id="apiStatus">等待</strong>
        </div>
        <div class="status-pill">
          <span>CSS profile</span>
          <strong id="cssProfile">—</strong>
        </div>
        <div class="status-pill">
          <span>Tint α</span>
          <strong id="tintAlpha">—</strong>
        </div>
      </div>
    </section>

    <section class="mode-switcher" aria-label="玻璃效果模式">
      <button class="mode-button" data-mode="pure" type="button">
        <strong>Pure</strong>
        <span>1 · clear only</span>
      </button>
      <button class="mode-button" data-mode="edge" type="button">
        <strong>Edge Glass</strong>
        <span>2 · edge only</span>
      </button>
      <button class="mode-button" data-mode="tint" type="button">
        <strong>Tint Glass</strong>
        <span>3 · thin tint</span>
      </button>
      <button class="mode-button" data-mode="frost" type="button">
        <strong>CSS Frost</strong>
        <span>4 · CSS blur 4px</span>
      </button>
      <button class="mode-button" data-mode="acrylic-0" type="button">
        <strong>Acrylic α0</strong>
        <span>5 · system</span>
      </button>
      <button class="mode-button" data-mode="acrylic-12" type="button">
        <strong>Acrylic α12</strong>
        <span>6 · system</span>
      </button>
      <button class="mode-button" data-mode="acrylic-78" type="button">
        <strong>Acrylic α78</strong>
        <span>7 · system</span>
      </button>
      <button class="mode-button" data-mode="blur-0" type="button">
        <strong>Blur α0</strong>
        <span>8 · system</span>
      </button>
      <button class="mode-button reference-mode" data-mode="split-acrylic" type="button">
        <strong>Split Acrylic</strong>
        <span>9 · left clear / right frost</span>
      </button>
      <button class="mode-button reference-mode" data-mode="split-clear" type="button">
        <strong>Split Clear</strong>
        <span>0 · CSS split only</span>
      </button>
    </section>

    <footer>
      <span>重点比较 9 / 0：同一套左右分区 CSS，只差底层有没有系统 Acrylic。</span>
      <span>0–9 快捷切换</span>
    </footer>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
