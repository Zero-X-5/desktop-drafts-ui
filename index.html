  <div class="desktop-copy"><strong>拾笺界面预览</strong><span>双击标题区展开/收起 · 单击草稿进入编辑</span></div>

  <main class="app-window" id="appWindow" aria-label="拾笺原型">
    <section class="collapsed-bar" id="collapsedBar">
      <div class="collapsed-brand" id="dragZone" title="双击展开，拖动移动">
        <span class="brand-mark"><svg><use href="#i-note"/></svg></span>
        <span class="collapsed-title" id="collapsedTitle">拾笺</span>
      </div>
      <button class="icon-button" id="collapsedHideButton" title="隐藏到任务栏"><svg><use href="#i-minus"/></svg></button>
    </section>

    <section class="expanded-shell">
      <header class="window-toolbar" id="windowToolbar">
        <div class="toolbar-brand"><span class="brand-mark"><svg><use href="#i-note"/></svg></span><span>拾笺</span></div>
        <div class="toolbar-actions">
          <button class="icon-button" id="topmostButton" title="保持在最前" aria-label="保持在最前" aria-pressed="false"><svg><use href="#i-bring-front"/></svg></button>
          <button class="icon-button" id="settingsButton" title="设置"><svg><use href="#i-settings-custom"/></svg></button>
          <button class="icon-button" id="hideButton" title="隐藏到任务栏"><svg><use href="#i-minus"/></svg></button>
        </div>
      </header>

      <div class="window-content">
        <div class="directory-view" id="directoryView">
          <aside class="list-panel">
            <label class="search-box"><svg><use href="#i-search"/></svg><input id="searchInput" placeholder="搜索草稿…" /></label>
            <div class="filter-row"><button class="filter-button" id="sortButton">最近修改 <svg><use href="#i-chevron-down"/></svg></button><button class="filter-button" id="addButton">＋ 新建</button></div>
            <div class="draft-list" id="draftList"></div>
          </aside>
        </div>
        <section class="editor-panel">
          <header class="editor-header">
            <input class="title-input" id="titleInput" aria-label="文件名" />
            <span class="save-status" id="saveStatus">已保存</span>
            <button class="icon-button" id="copyCurrentButton" title="复制正文" aria-label="复制正文"><svg><use href="#i-copy"/></svg></button>
          </header>
          <div class="conflict-banner" id="conflictBanner">
            <svg><use href="#i-warning"/></svg><span>文件已被外部修改</span>
            <button class="text-button" id="reloadButton">重新加载</button>
            <button class="text-button muted" id="ignoreButton">忽略</button>
          </div>
          <div class="editor-wrap"><textarea class="editor" id="editor" placeholder="开始写点什么…"></textarea></div>
        </section>
      </div>

      <aside class="popover settings-popover" id="settingsPopover">
        <section class="settings-section">
          <div class="settings-label">外观</div>
          <div class="setting-row"><span>主题</span><div class="segmented" id="themeSegment"><button data-theme="light">浅色</button><button data-theme="dark" class="active">深色</button><button data-theme="auto">自动</button></div></div>
          <div class="setting-row"><span>字体</span><span class="path">等宽字体 <svg><use href="#i-chevron-down"/></svg></span></div>
        </section>
        <section class="settings-section">
          <div class="settings-label">行为</div>
          <div class="setting-row"><span>保持在最前</span><button class="switch" id="topmostSwitch" aria-label="保持在最前" aria-pressed="false"></button></div>
          <div class="setting-row"><span>开机自启</span><button class="switch"></button></div>
          <div class="setting-row"><span>快捷唤起</span><button class="switch on"></button></div>
          <div class="setting-row"><span>自动保存</span><button class="switch on"></button></div>
        </section>
        <section class="settings-section">
          <div class="settings-label">文件</div>
          <div class="setting-row"><span>编码</span><span class="path">UTF-8 <svg><use href="#i-chevron-down"/></svg></span></div>
          <div class="setting-row"><span>存储路径</span><span class="path">C:\文档\拾笺 →</span></div>
        </section>
        <section class="settings-section">
          <button class="demo-button" id="conflictDemoButton">演示外部修改冲突</button>
        </section>
      </aside>

      <div class="context-menu" id="contextMenu">
        <button class="menu-item" data-action="pin"><svg><use href="#i-pin"/></svg><span id="pinActionLabel">置顶</span><kbd>Ctrl+P</kbd></button>
        <button class="menu-item" data-action="rename"><svg><use href="#i-edit"/></svg><span>重命名</span><kbd>F2</kbd></button>
        <button class="menu-item" data-action="copy"><svg><use href="#i-copy"/></svg><span>复制内容</span><kbd>Ctrl+C</kbd></button>
        <button class="menu-item" data-action="folder"><svg><use href="#i-folder"/></svg><span>打开文件夹</span><kbd></kbd></button>
        <div class="menu-separator"></div>
        <button class="menu-item danger" data-action="delete"><svg><use href="#i-trash"/></svg><span>移到回收站</span><kbd>Del</kbd></button>
      </div>

      <div class="modal-layer" id="modalLayer">
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
          <h2 id="deleteTitle">删除草稿</h2>
          <p id="deleteText">“文件名.txt”将被移动到系统回收站。</p>
          <div class="dialog-actions"><button class="dialog-button" id="cancelDelete">取消</button><button class="dialog-button danger" id="confirmDelete">移到回收站</button></div>
        </div>
      </div>

      <div class="toast" id="toast"><svg><use href="#i-check"/></svg><span id="toastText">已保存</span></div>
    </section>

    <div class="context-menu window-context-menu" id="windowContextMenu">
      <button class="menu-item" data-window-action="topmost"><svg><use href="#i-bring-front"/></svg><span id="windowTopmostLabel">保持在最前</span><kbd id="windowTopmostCheck"></kbd></button>
      <button class="menu-item" data-window-action="expand"><svg><use href="#i-note"/></svg><span>展开目录</span><kbd></kbd></button>
      <button class="menu-item" data-window-action="new"><svg><use href="#i-plus"/></svg><span>新建草稿</span><kbd></kbd></button>
      <button class="menu-item" data-window-action="hide"><svg><use href="#i-minus"/></svg><span>隐藏到任务栏</span><kbd></kbd></button>
    </div>
  </main>

  <footer class="taskbar"><span class="task-icon"></span><span class="task-icon active" id="taskbarApp" role="button" tabindex="0" aria-label="恢复拾笺"></span><span class="task-icon"></span><span class="task-icon"></span></footer>

  <script src="./app.js"></script>
</body>
</html>
