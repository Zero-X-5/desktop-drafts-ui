<body>

<button class="scene-btn" id="sceneBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#aab3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg>切换背景</button>
<script>
const tabArea=document.getElementById('tabArea'),tabScroll=document.getElementById('tabScroll'),indicator=document.getElementById('indicator'),editorTitle=document.getElementById('editorTitle'),editorBody=document.getElementById('editorBody'),saveMeta=document.getElementById('saveMeta'),searchButton=document.getElementById('searchButton'),searchShell=document.getElementById('searchShell'),searchInput=document.getElementById('searchInput'),newButton=document.getElementById('newButton'),moreButton=document.getElementById('moreButton'),moreMenu=document.getElementById('moreMenu'),emptySearch=document.getElementById('emptySearch');let nextId=1,token=0;
const content={"win下方栏运行的图标还是electron图":["当前下划线宽度会依据标签标题的实际可见宽度自动计算。","长标题得到更长的梯形线，短标题的梯形线更短，但都保留最小识别宽度。","切换时先收缩到中心，再移动到目标位置并展开。"],"GPT账号.txt":["短标题对应较短的梯形下划线。","文字始终在自己的标签区域中水平与垂直居中。","当前标签左右分割线自动隐藏。"],"产品发布检查":["发布前检查构建、签名、图标与自动更新。","右侧工具顺序固定为：搜索、新建、更多。","搜索框展开时不会改变编辑区域高度。"],"Codex Auth":["记录 Codex 登录与多账号切换流程。","三点按钮承载低频操作。","下划线采用顶部宽、底部窄的内收梯形。"],"本周需要处理":["修复窗口交互、摘要缓存和双击选择。","标签过多时保持单行横向滚动。","当前标签自动滚动到完整可见。"]};
const tabs=()=>[...tabScroll.querySelectorAll('.tab')],wraps=()=>[...tabScroll.querySelectorAll('.tab-wrap')];
function textWidth(tab){const l=tab.querySelector('.tab-label'),r=document.createRange();r.selectNodeContents(l);return Math.min(r.getBoundingClientRect().width,l.getBoundingClientRect().width)}
function geom(tab){const a=tabArea.getBoundingClientRect(),t=tab.getBoundingClientRect(),w=Math.round(Math.max(30,Math.min(132,Math.min(t.width-22,textWidth(tab)*.78+18)))*.9);return{w,x:t.left-a.left+(t.width-w)/2}}
function dividers(){const i=wraps().findIndex(w=>w.querySelector('.tab.active'));wraps().forEach((w,n)=>{const d=w.querySelector('.divider');if(d)d.classList.toggle('hidden',n===i||n===i-1)})}
function place(tab,now=false){if(!tab||tab.closest('.tab-wrap').style.display==='none'){indicator.style.opacity=0;return}indicator.style.opacity=1;const{w,x}=geom(tab);if(now){const tr=indicator.style.transition;indicator.style.transition='none';indicator.classList.remove('contracting');indicator.style.width=w+'px';indicator.style.transform=`translateX(${x}px)`;indicator.offsetWidth;indicator.style.transition=tr;return}const k=++token,cr=indicator.getBoundingClientRect(),ar=tabArea.getBoundingClientRect(),c=cr.left-ar.left+cr.width/2;indicator.classList.add('contracting');indicator.style.transform=`translateX(${c-6.5}px)`;setTimeout(()=>{if(k!==token)return;indicator.style.transform=`translateX(${x+w/2-6.5}px)`;setTimeout(()=>{if(k!==token)return;indicator.classList.remove('contracting');indicator.style.width=w+'px';indicator.style.transform=`translateX(${x}px)`},105)},82)}
function render(title){editorTitle.textContent=title;const lines=content[title]||["这是一个新建草稿。","标题与梯形下划线会自动适配。","可以立即开始输入。"],now=new Date();editorBody.innerHTML=lines.map((x,i)=>`<p${i===lines.length-1?' class="muted"':''}>${x}</p>`).join('');saveMeta.innerHTML=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} · <b>已保存</b>`}
function activate(tab,now=false){tabs().forEach(t=>t.classList.toggle('active',t===tab));dividers();place(tab,now);render(tab.dataset.title);tab.scrollIntoView({behavior:now?'auto':'smooth',inline:'nearest',block:'nearest'})}
function bind(tab){tab.addEventListener('click',()=>activate(tab))}tabs().forEach(bind);
function filter(q){q=q.trim().toLowerCase();let count=0;wraps().forEach(w=>{const t=w.querySelector('.tab'),ok=!q||t.dataset.title.toLowerCase().includes(q);w.style.display=ok?'flex':'none';if(ok)count++});emptySearch.classList.toggle('show',count===0);const active=tabScroll.querySelector('.tab.active');if(active&&active.closest('.tab-wrap').style.display!=='none'){dividers();place(active,true);return}const first=tabs().find(t=>t.closest('.tab-wrap').style.display!=='none');first?activate(first,true):indicator.style.opacity=0}
searchButton.addEventListener('click',()=>{const o=searchShell.classList.toggle('open');searchButton.classList.toggle('active',o);if(o)requestAnimationFrame(()=>searchInput.focus());else{searchInput.value='';filter('')}moreMenu.classList.remove('show')});searchInput.addEventListener('input',()=>filter(searchInput.value));
function create(){const title=`新建草稿 ${nextId++}`,ws=wraps(),last=ws[ws.length-1];if(last&&!last.querySelector('.divider')){const d=document.createElement('i');d.className='divider';last.appendChild(d)}const w=document.createElement('div');w.className='tab-wrap';const t=document.createElement('button');t.className='tab dirty';t.dataset.title=title;t.innerHTML=`<span class="tab-label">${title}</span>`;w.appendChild(t);tabScroll.appendChild(w);bind(t);searchInput.value='';filter('');activate(t);moreMenu.classList.remove('show')}
newButton.addEventListener('click',create);document.getElementById('menuNew').addEventListener('click',create);moreButton.addEventListener('click',e=>{e.stopPropagation();moreMenu.classList.toggle('show');moreButton.classList.toggle('active',moreMenu.classList.contains('show'))});document.addEventListener('pointerdown',e=>{if(!moreMenu.contains(e.target)&&!moreButton.contains(e.target)){moreMenu.classList.remove('show');moreButton.classList.remove('active')}});
document.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key)||document.activeElement===searchInput)return;const v=tabs().filter(t=>t.closest('.tab-wrap').style.display!=='none');if(!v.length)return;const i=v.findIndex(t=>t.classList.contains('active')),n=e.key==='ArrowRight'?(i+1)%v.length:(i-1+v.length)%v.length;v[n].focus();activate(v[n]);e.preventDefault()});window.addEventListener('resize',()=>place(tabScroll.querySelector('.tab.active'),true));requestAnimationFrame(()=>{dividers();place(tabScroll.querySelector('.tab.active'),true)});
// 背景切换（design-resources liquid-glass-btn 同款三场景）
const sceneBtn=document.getElementById('sceneBtn');
const BG=["https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/f0733c36-a64b-4f7c-b06c-3c679f8ddbc1_3840w.webp","https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/ac5ddc71-c7e9-4c7d-8cf1-f31081856db9_3840w.webp","https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&w=1920&q=80"];
let bi=0;
function setBg(i){document.body.style.background=`#0b0d14 url("${BG[i]}") center/cover no-repeat fixed`}
setBg(0);
sceneBtn.addEventListener('click',()=>{bi=(bi+1)%BG.length;setBg(bi)});
// 窗口拖动：点击顶栏
const appBox=document.querySelector('.app');
let dragging=false,offX=0,offY=0;
appBox.querySelector('.toolbar').addEventListener('mousedown',e=>{dragging=true;offX=e.clientX-appBox.offsetLeft;offY=e.clientY-appBox.offsetTop;appBox.style.cursor='grabbing';e.preventDefault()});
document.addEventListener('mousemove',e=>{if(!dragging)return;appBox.style.left=(e.clientX-offX)+'px';appBox.style.top=(e.clientY-offY)+'px'});
document.addEventListener('mouseup',()=>{dragging=false;appBox.style.cursor=''});
</script>
