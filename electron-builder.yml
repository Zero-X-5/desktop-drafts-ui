appId: com.shijian.desktop
productName: 拾笺
directories:
  output: dist
files:
  - electron/**/*
  - src/**/*
  - assets/**/*
  - package.json
win:
  icon: assets/icon.ico
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
