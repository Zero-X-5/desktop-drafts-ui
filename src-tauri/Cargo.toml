[package]
name = "shijian"
version = "0.1.0"
description = "拾笺 (Shijian) - a lightweight local-first TXT drafts app for Windows"
authors = ["Zero-X-5"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Zero-X-5/desktop-drafts-ui"
homepage = "https://github.com/Zero-X-5/desktop-drafts-ui"
publish = false

[lib]
name = "shijian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
trash = "5"
